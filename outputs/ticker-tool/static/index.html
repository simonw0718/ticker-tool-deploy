<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US Ticker K Tool</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-records" viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M14 4v4h4"/><path d="M8 12h8M8 16h8"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V5"/><path d="m8 9 4-4 4 4"/><path d="M5 19h14"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></symbol>
      <symbol id="icon-panels" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="6" rx="1"/><rect x="4" y="14" width="7" height="5" rx="1"/><rect x="13" y="14" width="7" height="5" rx="1"/></symbol>
      <symbol id="icon-table" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M9 5v14M15 5v14"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></symbol>
      <symbol id="icon-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="icon-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    </svg>
    <main class="app">
      <aside class="panel">
        <div class="brand">
          <div>
            <h1>US Ticker K Tool</h1>
            <p>Daily / Weekly charts and raw OHLCV</p>
          </div>
        </div>
        <a class="nav-link icon-button" href="/records.html"><svg class="icon"><use href="#icon-records"></use></svg><span>Records</span></a>

        <label class="field">
          <span>TICKERS</span>
          <div id="listTabs" class="list-tabs" role="tablist">
            <button type="button" data-list="own" class="active">Own</button>
            <button type="button" data-list="keyWatch">Key Watch</button>
            <button type="button" data-list="watchlist">Watchlist</button>
          </div>
          <button id="addListBtn" type="button" class="add-list icon-button"><svg class="icon"><use href="#icon-plus"></use></svg><span>Add Group</span></button>
          <div class="list-tools" aria-label="Ticker group tools">
            <button id="renameListBtn" type="button" class="icon-button"><svg class="icon"><use href="#icon-edit"></use></svg><span>Rename</span></button>
            <button id="moveListLeftBtn" type="button" aria-label="Move group left"><svg class="icon"><use href="#icon-left"></use></svg></button>
            <button id="moveListRightBtn" type="button" aria-label="Move group right"><svg class="icon"><use href="#icon-right"></use></svg></button>
            <button id="deleteListBtn" type="button" aria-label="Delete group"><svg class="icon"><use href="#icon-trash"></use></svg></button>
          </div>
          <textarea id="tickers" spellcheck="false">AAPL
MSFT
NVDA
TSLA
SPY
QQQ</textarea>
        </label>

        <div class="grid2">
          <label class="field">
            <span>START</span>
            <input id="start" type="date" />
          </label>
          <label class="field">
            <span>END</span>
            <input id="end" type="date" />
          </label>
        </div>

        <label class="field">
          <span>RAW ROWS</span>
          <input id="rawDays" type="number" min="10" max="500" value="30" />
        </label>

        <button id="fetchBtn" class="primary icon-button"><svg class="icon"><use href="#icon-search"></use></svg><span>Fetch Data</span></button>
        <div class="progress" aria-hidden="true">
          <div id="fetchProgress" class="progress__bar"></div>
        </div>
        <label class="file">
          <input id="csvFile" type="file" accept=".csv" multiple />
          <span class="icon-button"><svg class="icon"><use href="#icon-upload"></use></svg><span>Import CSV</span></span>
        </label>
        <div id="status" class="status">Ready</div>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <div id="tickerButtons" class="ticker-buttons"></div>
          </div>
          <div class="actions">
            <div class="segmented" role="tablist">
              <button id="dailyBtn" class="active">Daily</button>
              <button id="weeklyBtn">Weekly</button>
              <button id="hourlyBtn">1H</button>
              <button id="fourHourBtn">4H</button>
            </div>
            <button id="copyChartBtn" class="icon-button"><svg class="icon"><use href="#icon-copy"></use></svg><span>Copy Chart</span></button>
            <button id="copyBundleBtn" class="icon-button"><svg class="icon"><use href="#icon-panels"></use></svg><span>Copy Full Page</span></button>
            <button id="downloadCsvBtn" class="icon-button"><svg class="icon"><use href="#icon-table"></use></svg><span>CSV</span></button>
          </div>
        </header>

        <section class="output-options">
          <span>Full Page</span>
          <label><input type="checkbox" data-output-panel="daily" checked /> Daily</label>
          <label><input type="checkbox" data-output-panel="weekly" checked /> Weekly</label>
          <label><input type="checkbox" data-output-panel="hourly" /> 1H</label>
          <label><input type="checkbox" data-output-panel="fourHour" checked /> 4H</label>
          <label><input type="checkbox" data-output-panel="table" checked /> Table</label>
        </section>

        <section id="captureArea" class="capture-area">
          <div class="chart-head">
            <div>
              <div id="title" class="title">Select a ticker</div>
              <div id="subtitle" class="subtitle"></div>
            </div>
            <div id="quoteBox" class="quote"></div>
          </div>
          <canvas id="chart" width="1400" height="820"></canvas>
        </section>

        <section class="table-section">
          <div class="table-head">
            <h2>Raw Data</h2>
            <span id="tableMeta"></span>
          </div>
          <div class="table-wrap">
            <table id="rawTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
